StylesPath = styles

; MapLarge rules apply to actual skills only. Docs like skill-template.md quote
; anti-examples on purpose and would self-flag, so they are deliberately out of scope.
; Globs start with **/ so they match both relative paths (CLI from repo root) and
; absolute paths (the editor's language server) — an anchored glob matches nothing
; when Vale is handed absolute paths.
[**/plugins/maplarge-adk/skills/**/*.md]
BasedOnStyles = MapLarge

; Eval case files (golden prompts, docs/eval-format.md) are exempt: they legitimately
; quote what skills must not say (assistant names, banned phrases, deprecated APIs)
; and are never loaded as skill guidance. Later sections win, so this walls them off.
[**/plugins/maplarge-adk/skills/**/evals/*.md]
BasedOnStyles =
